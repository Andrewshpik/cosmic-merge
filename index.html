<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cosmic Merge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">COSMIC<span>MERGE</span></div>
      <div class="stats">
        <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
        <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
        <button id="history" title="История">🏆</button>
        <button id="reset" title="Restart">↻</button>
      </div>
    </header>

    <main>
      <div class="board-wrap">
        <canvas id="game"></canvas>
        <div id="next-preview" class="next-preview">
          <span class="label">Next</span>
          <div id="next-orb"></div>
        </div>
      </div>

      <aside class="evolution">
        <div class="evolution-title">Эволюция</div>
        <div id="tier-list" class="tier-list"></div>
      </aside>
    </main>

    <div id="game-over" class="overlay hidden">
      <h1>GAME OVER</h1>
      <div id="final-stats"></div>
      <button id="restart-btn">Заново</button>
    </div>

    <div id="history-screen" class="overlay hidden">
      <h1>ИСТОРИЯ</h1>
      <div id="history-content"></div>
      <button id="history-close">Закрыть</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
